name: HTTP browser QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install the pinned test-only dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install the corresponding Chromium on this CI runner
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Set up PNG validation
        run: |
          python3 -m venv "$RUNNER_TEMP/halo-browser-venv"
          "$RUNNER_TEMP/halo-browser-venv/bin/python" -m pip install 'Pillow==11.3.0'
      - name: Build and test the actual HTTP interface
        env:
          HALO_PYTHON: ${{ runner.temp }}/halo-browser-venv/bin/python
        run: npm run build && npm run qa:browser
      - name: Retain test report and captures only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http-qa-v096
          path: |
            tests/http-v090/
            tests/http-sprites/
            tests/http-art-v092/
            tests/http-clips-v093/
            tests/http-recovery-v094/
            tests/http-boundaries-v095/
            tests/http-presentations/
            tests/http-reference-integration/
            tests/http-chronicles/
            tests/http-stage-bitmaps/
            tests/http-alessa-weapons/
            tests/http-source-expansion/
            tests/http-cinematic-expansion/
          retention-days: 14
