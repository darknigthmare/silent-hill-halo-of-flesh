name: HTTP browser QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check historical artwork contracts before browser setup
        run: node scripts/http-qa-art-batch4.mjs --metadata-only
      - name: Install the pinned test-only dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install the corresponding Chromium on this CI runner
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Set up PNG validation
        run: |
          python3 -m venv "$RUNNER_TEMP/halo-browser-venv"
          "$RUNNER_TEMP/halo-browser-venv/bin/python" -m pip install 'Pillow==11.3.0'
      - name: Build and test the actual HTTP interface
        env:
          HALO_PYTHON: ${{ runner.temp }}/halo-browser-venv/bin/python
        run: npm run build && npm run qa:browser
      - name: Retain test report and captures only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http-qa-v096
          path: |
            tests/http-v090/
            tests/http-sprites/
            tests/http-art-v092/
            tests/http-clips-v093/
            tests/http-recovery-v094/
            tests/http-boundaries-v095/
            tests/http-presentations/
            tests/http-reference-integration/
            tests/http-chronicles/
            tests/http-stage-bitmaps/
            tests/http-alessa-weapons/
            tests/http-source-expansion/
            tests/http-cinematic-expansion/
            tests/http-art-batch4/
          retention-days: 14
  new-artwork:
    name: New artwork over HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install the pinned test-only dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install the corresponding Chromium on this CI runner
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Set up PNG validation
        run: |
          python3 -m venv "$RUNNER_TEMP/halo-browser-venv"
          "$RUNNER_TEMP/halo-browser-venv/bin/python" -m pip install 'Pillow==11.3.0'
      - name: Build the actual HTTP interface
        id: build
        env:
          HALO_PYTHON: ${{ runner.temp }}/halo-browser-venv/bin/python
        run: npm run build
      - name: Inspect wave26 native artwork in the built HTTP app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node docs/production/vague26/run-ci-browser-check.mjs
      - name: Inspect wave27 attacks, projectiles and stages in the built HTTP app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node docs/production/vague27/run-ci-browser-check.mjs
      - name: Inspect wave28 attacks, projectiles and stages in the built HTTP app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node docs/production/vague28/run-ci-browser-check.mjs
      - name: Retain new artwork reports and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http-wave26-28
          path: |
            tests/http-wave26-native/
            tests/http-wave27-actions/
            tests/http-wave27-stages/
            tests/http-wave28-actions/
            tests/http-wave28-stages/
          retention-days: 14
