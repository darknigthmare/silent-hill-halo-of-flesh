name: Bootstrap v0.5.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v050.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download verified v0.5.0 source archive
        env:
          ARCHIVE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-cb90-820a-95f9-7f1fab3267d9/raw?se=2026-10-10T23%3A18%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=3b0d34dd-1745-573b-9c60-cb0e2d0739f0&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T01%3A15%3A11Z&ske=2026-10-11T01%3A15%3A11Z&sks=b&skv=2026-02-06&sig=TxHcpd8e75QhAT205cZlx1GqmdgvvDrp5TN7WTeMjig%3D"
        run: |
          curl --fail --location --retry 3 --output /tmp/halo-v0.5.0.tar.gz "$ARCHIVE_URL"
          echo "672b4e8470c5e4817bfff9c595649327758f98e80be74bc1e1de31bcf0d1af78  /tmp/halo-v0.5.0.tar.gz" | sha256sum --check --strict

      - name: Restore complete project tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/halo-v0.5.0.tar.gz --strip-components=1 -C .
          test -f package.json
          test -f src/fight.js
          test -f src/movesets.js
          test -f data/movesets.json
          test -f docs/RELEASE_NOTES_v0.5.0.md
          test -f scripts/browser-qa-v050.mjs

      - name: Run full QA
        run: npm test

      - name: Publish v0.5.0 candidate to main
        run: |
          git config user.name "darknigthmare"
          git config user.email "chuckykill@hotmail.fr"
          git add -A
          git commit -m "feat: lore-first complete movesets and signal interface v0.5.0"
          git push origin main
