name: Import reviewed raster integration v091
on:
  push:
    branches: [feat/bitmap-sprites-v091]
    paths: ['.art-import/**']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify and apply reviewed source patch and two native images
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/bitmap-sprites-v091'
          test "$(git rev-parse HEAD^)" = '17026291e97a1719658ac2fa1eb6f538391c7d68'
          python - <<'PY'
          import hashlib, lzma, pathlib, subprocess, urllib.request
          p = pathlib.Path('.art-import')
          packed = b''.join((p / f'part{i}.xz').read_bytes() for i in range(1, 4))
          assert hashlib.sha256(packed).hexdigest() == '4f96ed61603cae04ee0b652c90ae9c761d2421e9721de4230cad95ed533fb281'
          patch = lzma.decompress(packed)
          assert len(patch) < 1_000_000
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  for name in line.split()[2:]:
                      path = pathlib.PurePosixPath(name)
                      assert path.parts[0] in ('a', 'b') and '..' not in path.parts
                      assert not any(part in ('.git', '.github') for part in path.parts)
          tmp = pathlib.Path('/tmp/halo-reviewed.patch')
          tmp.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(tmp)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(tmp)], check=True)
          images = [
              ('assets/sprites/sh1_air_screamer_001.d8f940210f1c.png', '36ef8d9f-b87c-4dc0-9f9c-d078034d4323', 'd8f940210f1cf7201ea32871a7dbc3aa7655d2adf20206aa582ca9653ec59ad5', 2142783),
              ('assets/sprites/film_red_pyramid_film_175.36b284a5f726.png', 'b6f551ea-7f15-45b1-8bc7-3aad8862f087', '36b284a5f726ee2158490be8d96b15e18a6bc315860d22bcc51496900ffaa0e7', 1660441),
          ]
          for name, media, digest, size in images:
              url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JHwJlNzgmcxQy32tjF7NiVZPuH/' + media + '.png'
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read(size + 1)
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, name
              output = pathlib.Path(name)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
          PY
      - name: Verify source, native asset manifest and all engine tests
        run: npm test
      - name: Verify final tree and publish only the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          index_copy=$(mktemp)
          cp .git/index "$index_copy"
          GIT_INDEX_FILE="$index_copy" git update-index --force-remove .art-import/part1.xz .art-import/part2.xz .art-import/part3.xz .github/workflows/import-raster-v091.yml
          actual_tree=$(GIT_INDEX_FILE="$index_copy" git write-tree)
          rm "$index_copy"
          echo "Reviewed final tree: $actual_tree"
          test "$actual_tree" = 'e9d14040a1a1e1d08ffae08a445ca7b01bc79acb'
          git config user.name darknigthmare
          git config user.email 7942594+darknigthmare@users.noreply.github.com
          git commit -m 'feat: integrate native raster sprites, asset workshop and guarded fight loading'
          git push origin HEAD:refs/heads/feat/bitmap-sprites-v091
