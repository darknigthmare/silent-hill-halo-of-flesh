name: Import reviewed boundary fixes v095
on:
  push:
    branches: [feat/bitmap-sprites-v091]
    paths: ['.art-import/v095-*']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/bitmap-sprites-v091'
          test "$(git rev-parse HEAD^)" = '171ebadcb78023c1496fa4132a95ac13ae7bb1b6'
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          packed = b''.join(pathlib.Path(f'.art-import/v095-part{i}.xz').read_bytes() for i in (1, 2))
          assert hashlib.sha256(packed).hexdigest() == '44b8cf6e165cc6e7b78774bedc6d10dc9f13a7d154fcd7b4f964c5577847f4d4'
          patch = lzma.decompress(packed)
          assert len(patch) == 62200
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  for name in line.split()[2:]:
                      path = pathlib.PurePosixPath(name)
                      assert path.parts[0] in ('a', 'b') and '..' not in path.parts and '.git' not in path.parts
                      if '.github' in path.parts:
                          assert '/'.join(path.parts[1:]) == '.github/workflows/browser-qa.yml'
          tmp = pathlib.Path('/tmp/halo-v095.patch')
          tmp.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(tmp)], check=True)
          subprocess.run(['git', 'apply', str(tmp)], check=True)
          PY
      - name: Verify engine and authoring regressions
        shell: bash
        run: |
          set -euo pipefail
          npm test
          python3 -m venv "$RUNNER_TEMP/halo-v095-venv"
          . "$RUNNER_TEMP/halo-v095-venv/bin/activate"
          python -m pip install 'Pillow==11.3.0'
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify final tree and publish only this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          index_copy=$(mktemp)
          cp .git/index "$index_copy"
          GIT_INDEX_FILE="$index_copy" git update-index --force-remove .art-import/v095-part1.xz .art-import/v095-part2.xz .github/workflows/import-boundaries-v095.yml
          actual_tree=$(GIT_INDEX_FILE="$index_copy" git write-tree)
          rm "$index_copy"
          echo "Reviewed final tree: $actual_tree"
          test "$actual_tree" = '4e9cec41bdd035ee58e04846a299985b2dee8dcb'
          git config user.name darknigthmare
          git config user.email 7942594+darknigthmare@users.noreply.github.com
          git commit -m 'fix: isolate input edges, validate backup saves and guard engine lifecycle'
          git push origin HEAD:refs/heads/feat/bitmap-sprites-v091
