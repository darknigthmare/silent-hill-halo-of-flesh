name: Publish v0.3.0 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v030.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: d4be51946860726b699733a810531c11eae1fe03
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Validate release
        run: npm test

      - name: Build release archives
        run: |
          mkdir -p release
          zip -qr release/SILENT-HILL-HALO-OF-FLESH_v0.3.0_SOURCE.zip . \
            -x '.git/*' 'release/*' '.github/workflows/release-v030.yml' 'tests/captures*/*'
          (cd dist && zip -qr ../release/SILENT-HILL-HALO-OF-FLESH_v0.3.0_VERCEL_BUILD.zip .)
          zip -qr release/SILENT-HILL-HALO-OF-FLESH_v0.3.0_DOCUMENTATION.zip \
            README.md CHANGELOG.md NOTICE.md LICENSE docs data/content-stats.json data/combat-rules.json
          (cd release && sha256sum *.zip > SILENT-HILL-HALO-OF-FLESH_v0.3.0_CHECKSUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 release/* --clobber
          else
            gh release create v0.3.0 release/* \
              --target "$TARGET_SHA" \
              --title "Silent Hill: Halo of Flesh v0.3.0" \
              --notes-file docs/RELEASE_NOTES_v0.3.0.md
          fi
