name: Bootstrap v0.6.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v061.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download verified v0.6.1 source archive
        env:
          ARCHIVE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-41c0-820a-a1a6-baa0ea3a0526/raw?se=2026-10-11T09%3A12%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=7a7192b9-0578-5b09-9ad5-6de1ff0ef073&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T06%3A28%3A05Z&ske=2026-10-12T06%3A28%3A05Z&sks=b&skv=2026-02-06&sig=dphYffzLd2m1xYQb2fbOJ%2Ber0L%2BGyM7OOwuCRHALbtI%3D"
        run: |
          curl --fail --location --retry 3 --output /tmp/halo-v0.6.1.tar.gz "$ARCHIVE_URL"
          echo "819527ef005ffbd8c962f6a772ab208b9fd82a105c23c116b8baf10c2f48e86f  /tmp/halo-v0.6.1.tar.gz" | sha256sum --check --strict

      - name: Restore complete project tree
        run: |
          mkdir -p /tmp/halo-v061
          tar -xzf /tmp/halo-v0.6.1.tar.gz --strip-components=1 -C /tmp/halo-v061
          test -f /tmp/halo-v061/package.json
          test -f /tmp/halo-v061/offline.html
          test -f /tmp/halo-v061/404.html
          test -f /tmp/halo-v061/docs/RELEASE_NOTES_v0.6.1.md
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/halo-v061/. .
          rm -f .github/workflows/bootstrap-v061.yml

      - name: Run full QA
        run: npm test

      - name: Publish v0.6.1 to main
        run: |
          git config user.name "darknigthmare"
          git config user.email "chuckykill@hotmail.fr"
          git add -A
          git commit -m "fix: harden offline signal and release integrity v0.6.1"
          git push origin main
