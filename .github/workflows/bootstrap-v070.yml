name: Bootstrap v0.7.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v070.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download verified v0.7.0 source archive
        env:
          ARCHIVE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-cfc4-820a-83c0-7850b78d515c/raw?se=2026-10-11T10%3A07%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=b7f214c1-8f14-5d5b-973e-d4053e7655ed&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T05%3A40%3A12Z&ske=2026-10-12T05%3A40%3A12Z&sks=b&skv=2026-02-06&sig=D25pZSSN55ariEXxNG%2B%2BeYtB/0t75OyMZK9AV/pWxxw%3D"
        run: |
          curl --fail --location --retry 3 --output /tmp/halo-v0.7.0.tar.gz "$ARCHIVE_URL"
          echo "210d11201a2dcbba233aa22660f744203140ffa8ad81eaad658a6d7a232af41a  /tmp/halo-v0.7.0.tar.gz" | sha256sum --check --strict

      - name: Restore complete project tree
        run: |
          mkdir -p /tmp/halo-v070
          tar -xzf /tmp/halo-v0.7.0.tar.gz --strip-components=1 -C /tmp/halo-v070
          test -f /tmp/halo-v070/package.json
          test -f /tmp/halo-v070/src/stage-director.js
          test -f /tmp/halo-v070/data/stage-director.json
          test -f /tmp/halo-v070/docs/LORE_STAGE_GAMEPLAY.md
          test -f /tmp/halo-v070/docs/RELEASE_NOTES_v0.7.0.md
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/halo-v070/. .
          rm -f .github/workflows/bootstrap-v070.yml

      - name: Run complete v0.7.0 QA
        run: npm test

      - name: Publish v0.7.0 to main
        run: |
          git config user.name "darknigthmare"
          git config user.email "chuckykill@hotmail.fr"
          git add -A
          git commit -m "feat: living Otherworld stage director v0.7.0"
          git push origin main
