name: Import reviewed clip authoring v093
on:
  push:
    branches: [feat/bitmap-sprites-v091]
    paths: ['.art-import/v093-*']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply the exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/bitmap-sprites-v091'
          test "$(git rev-parse HEAD^)" = '6998226008f06c631adb51ab4890a099fdb717a6'
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          packed = b''.join(pathlib.Path(f'.art-import/v093-part{i}.xz').read_bytes() for i in (1, 2))
          assert hashlib.sha256(packed).hexdigest() == 'bf87d6badfe571410df0c60e9f2c152982377341a8b2e239b13b103d7520f7cd'
          patch = lzma.decompress(packed)
          assert len(patch) == 59313
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  for name in line.split()[2:]:
                      path = pathlib.PurePosixPath(name)
                      assert path.parts[0] in ('a', 'b') and '..' not in path.parts
                      assert not any(part in ('.git', '.github') for part in path.parts)
          tmp = pathlib.Path('/tmp/halo-v093.patch')
          tmp.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(tmp)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(tmp)], check=True)
          PY
      - name: Run engine and authoring regression tests
        run: |
          npm test
          python3 -m venv "$RUNNER_TEMP/halo-clip-venv"
          . "$RUNNER_TEMP/halo-clip-venv/bin/activate"
          python -m pip install 'Pillow==11.3.0'
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify final source tree and publish only the existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          index_copy=$(mktemp)
          cp .git/index "$index_copy"
          GIT_INDEX_FILE="$index_copy" git update-index --force-remove .art-import/v093-part1.xz .art-import/v093-part2.xz .github/workflows/import-clips-v093.yml
          actual_tree=$(GIT_INDEX_FILE="$index_copy" git write-tree)
          rm "$index_copy"
          echo "Reviewed final tree: $actual_tree"
          test "$actual_tree" = 'a93350f69359ab7b8a060e68b2c83bc2f2e776fa'
          git config user.name darknigthmare
          git config user.email 7942594+darknigthmare@users.noreply.github.com
          git commit -m 'feat: author individual raster timelines and guard clip publication'
          git push origin HEAD:refs/heads/feat/bitmap-sprites-v091
