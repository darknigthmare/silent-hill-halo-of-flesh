name: Import reviewed recovery fixes v094
on:
  push:
    branches: [feat/bitmap-sprites-v091]
    paths: ['.art-import/v094-*']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/bitmap-sprites-v091'
          test "$(git rev-parse HEAD^)" = 'a9d3d44776da5a25b5614aebc78b613dc71b2231'
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          packed = b''.join(pathlib.Path(f'.art-import/v094-part{i}.xz').read_bytes() for i in (1, 2))
          assert hashlib.sha256(packed).hexdigest() == '99f1ccd37fd6f4f3c1831db7a3ede78624eb7c8911e1e65ba4f24b4ece9ce818'
          patch = lzma.decompress(packed)
          assert len(patch) == 62387
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  for name in line.split()[2:]:
                      path = pathlib.PurePosixPath(name)
                      assert path.parts[0] in ('a', 'b') and '..' not in path.parts
                      assert not any(part in ('.git', '.github') for part in path.parts)
          tmp = pathlib.Path('/tmp/halo-v094.patch')
          tmp.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(tmp)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(tmp)], check=True)
          PY
      - name: Verify engine and authoring regressions
        run: |
          npm test
          python3 -m venv "$RUNNER_TEMP/halo-v094-venv"
          . "$RUNNER_TEMP/halo-v094-venv/bin/activate"
          python -m pip install 'Pillow==11.3.0'
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify final tree and publish only this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          index_copy=$(mktemp)
          cp .git/index "$index_copy"
          GIT_INDEX_FILE="$index_copy" git update-index --force-remove .art-import/v094-part1.xz .art-import/v094-part2.xz .github/workflows/import-recovery-v094.yml
          actual_tree=$(GIT_INDEX_FILE="$index_copy" git write-tree)
          rm "$index_copy"
          echo "Reviewed final tree: $actual_tree"
          test "$actual_tree" = '0e1843634f4312d31b0f3abcf758b1f73fe22e8c'
          git config user.name darknigthmare
          git config user.email 7942594+darknigthmare@users.noreply.github.com
          git commit -m 'fix: recover runs safely and correct touch guard, cache failures and art drafts'
          git push origin HEAD:refs/heads/feat/bitmap-sprites-v091
