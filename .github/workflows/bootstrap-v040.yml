name: Bootstrap v0.4.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v040.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download verified v0.4.0 source archive
        env:
          ARCHIVE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-cb98-8210-a4aa-e3f68cc9f4dc/raw?se=2026-10-10T21%3A43%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=d09e4dce-f288-5131-af0a-249b0543366c&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T04%3A53%3A59Z&ske=2026-10-11T04%3A53%3A59Z&sks=b&skv=2026-02-06&sig=WhHAuF%2BkEB3bFNqH0aE1iR1R2pQ1%2BYDbvcs8wkKFl%2BY%3D"
        run: |
          curl --fail --location --retry 3 --output /tmp/halo-v0.4.0.tar.gz "$ARCHIVE_URL"
          echo "e72e60a729fb0fc04a9259339f1f45ed64240b9db443ae8938ddcab9f7e33f41  /tmp/halo-v0.4.0.tar.gz" | sha256sum --check --strict

      - name: Restore complete project tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/halo-v0.4.0.tar.gz -C .
          test -f package.json
          test -f src/fight.js
          test -f docs/RELEASE_NOTES_v0.4.0.md

      - name: Run full QA
        run: npm test

      - name: Publish v0.4.0 candidate to main
        run: |
          git config user.name "darknigthmare"
          git config user.email "chuckykill@hotmail.fr"
          git add -A
          git commit -m "feat: complete roster, fatalities and animated stages v0.4.0"
          git push origin main
