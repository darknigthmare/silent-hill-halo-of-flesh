name: Integrate verified v0.8.1
on:
  push:
    branches: [feat/lore-combat-stages-v081]
    paths: [.github/workflows/integrate-v081.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feat/lore-combat-stages-v081
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download only the verified project sources
        env:
          SOURCE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-01e4-820a-a060-8bca953ea9cf/raw?se=2026-10-12T08%3A37%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=91fa9df8-10b2-521d-ad9b-6d47cff819ae&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T04%3A04%3A13Z&ske=2026-10-13T04%3A04%3A13Z&sks=b&skv=2026-02-06&sig=gYPE%2BIgzyBcDMIaSL9LcNVOiVgErUvTl3PfbHMxbbmk%3D"
        run: |
          curl --fail --location --retry 2 --max-time 90 "$SOURCE_URL" -o /tmp/halo-v081.tar.gz
          echo '57c957cb4a246dd5a878031b403f16e8379ffa51b3ae9b6a37fd7451b6aed34b  /tmp/halo-v081.tar.gz' | sha256sum --check --strict
      - name: Overlay validated regular files without deleting unrelated repository files
        run: |
          python3 - <<'PY'
          import tarfile, pathlib
          root=pathlib.Path.cwd()
          with tarfile.open('/tmp/halo-v081.tar.gz','r:gz') as archive:
              members=archive.getmembers()
              for member in members:
                  path=pathlib.PurePosixPath(member.name)
                  assert member.isfile(), member.name
                  assert not path.is_absolute() and '..' not in path.parts, member.name
                  assert path.parts[0]=='SILENT-HILL-HALO-OF-FLESH_v0.8.1', member.name
                  rel=pathlib.Path(*path.parts[1:])
                  assert rel.parts and rel.parts[0] not in ('.git','node_modules','dist'), member.name
                  dest=root/rel
                  assert not dest.is_symlink(), member.name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(archive.extractfile(member).read())
          PY
          test -f src/combat-geometry.js
          test -f tests/gameplay-coherence.test.mjs
          rm .github/workflows/integrate-v081.yml
      - name: Run all 109 tests and rebuild exports
        run: npm test
      - name: Commit and push only the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: coherent bodies, moving hazards and stage-local motifs v0.8.1'
          git push origin HEAD:refs/heads/feat/lore-combat-stages-v081
          echo "Published feature commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
