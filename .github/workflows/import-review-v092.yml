name: Import verified v092 source
on:
  push:
    branches: [feat/bitmap-sprites-v091]
    paths: ['.github/workflows/import-review-v092.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Import exact reviewed source archive only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/bitmap-sprites-v091'
          test "$(git rev-parse HEAD^)" = '3e75e4156baccecac558b2a524608e67cda84b4f'
          python3 - <<'PY'
          import hashlib, io, pathlib, stat, urllib.request, zipfile
          url = 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-cf88-81f5-9fb7-deca6b25a881/raw?se=2026-10-16T13%3A29%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=bbab3c07-dbef-5269-a57a-8358483e0fa1&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T04%3A58%3A18Z&ske=2026-10-17T04%3A58%3A18Z&sks=b&skv=2026-02-06&sig=d0FisHUzhem/MpQXSzP9OZ165ZSFGuQGvUvarPazK6E%3D'
          with urllib.request.urlopen(url, timeout=60) as response:
              raw = response.read(4954835)
          assert len(raw) == 4954834 and hashlib.sha256(raw).hexdigest() == 'c29289591aa10283ba9911a33b736ec5d12b8951eb18cfad646ec46ecbaf7693'
          archive = zipfile.ZipFile(io.BytesIO(raw))
          entries = archive.infolist()
          assert len(entries) == 155 and sum(i.file_size for i in entries) == 16342038
          seen = set()
          for entry in entries:
              path = pathlib.PurePosixPath(entry.filename)
              assert path.parts[0] == 'silent-hill-halo-of-flesh' and '..' not in path.parts
              relative = pathlib.Path(*path.parts[1:])
              assert relative.parts and '.git' not in relative.parts and relative not in seen
              assert stat.S_IFMT(entry.external_attr >> 16) == stat.S_IFREG
              seen.add(relative)
              if relative.parts[0] == '.github':
                  assert pathlib.Path(relative).read_bytes() == archive.read(entry)
                  continue
              output = pathlib.Path(relative)
              assert not output.is_symlink()
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(archive.read(entry))
              output.chmod(0o755 if (entry.external_attr >> 16) & 0o111 else 0o644)
          PY
      - name: Run engine and real-pixel validation
        run: npm test
      - name: Publish exact verified tree only on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          index_copy=$(mktemp)
          cp .git/index "$index_copy"
          GIT_INDEX_FILE="$index_copy" git update-index --force-remove .github/workflows/import-review-v092.yml
          actual_tree=$(GIT_INDEX_FILE="$index_copy" git write-tree)
          rm "$index_copy"
          echo "Reviewed source tree: $actual_tree"
          test "$actual_tree" = '993b239535d6ed06c4b9f2d183caa34c01c6c386'
          git config user.name darknigthmare
          git config user.email 7942594+darknigthmare@users.noreply.github.com
          git commit -m 'feat: v092 sprite inspector, shared camera, pose clocks and pixel validation'
          git push origin HEAD:refs/heads/feat/bitmap-sprites-v091
