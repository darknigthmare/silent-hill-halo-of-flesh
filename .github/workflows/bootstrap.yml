name: Bootstrap v0.2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve bootstrap workflow
        run: cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml

      - name: Download verified v0.2.0 source archive
        env:
          ARCHIVE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-6840-8210-b3ea-239907b76fb2/raw?se=2026-10-10T17%3A00%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=95cabadc-1ef3-5b3d-925a-8119897618e3&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T03%3A01%3A15Z&ske=2026-10-11T03%3A01%3A15Z&sks=b&skv=2026-02-06&sig=MICQuuoRXtiXT5BQsPz4MHgAQ36k/rolw/oD4l9BkPk%3D"
        run: |
          curl --fail --location --retry 3 --output /tmp/halo-v0.2.0.tar.gz "$ARCHIVE_URL"
          echo "251220b1b1f1e8b8eb6db696f7ff0685ac3bb38e9e8492dbae1572246b0fbe49  /tmp/halo-v0.2.0.tar.gz" | sha256sum --check --strict

      - name: Restore complete project tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/halo-v0.2.0.tar.gz -C .
          rm -f .github/workflows/qa.yml
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml
          test -f package.json
          test -f src/fight.js

      - name: Run full QA
        run: npm test

      - name: Publish v0.2.0 code to main
        run: |
          git config user.name "darknigthmare"
          git config user.email "chuckykill@hotmail.fr"
          git add -A
          git commit -m "feat: publish Halo of Flesh v0.2.0"
          git push origin main
