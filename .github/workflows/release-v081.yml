name: Publish v0.8.1 prototype
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v081.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: 7506a87b06bc18e4e44aa30377e401117b92b2fc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build and verify exact release tree
        run: |
          git checkout --detach "$TARGET_SHA"
          npm test
          git diff --exit-code
      - name: Package sources and hosting build
        run: |
          mkdir -p /tmp/halo-release
          git archive --format=zip --prefix=SILENT-HILL-HALO-OF-FLESH_v0.8.1/ -o /tmp/halo-release/SILENT-HILL-HALO-OF-FLESH_v0.8.1_SOURCE.zip "$TARGET_SHA"
          (cd dist && zip -qr /tmp/halo-release/SILENT-HILL-HALO-OF-FLESH_v0.8.1_VERCEL_BUILD.zip .)
          cp docs/QA_v0.8.1.md /tmp/halo-release/QA_v0.8.1.md
          (cd /tmp/halo-release && sha256sum *.zip *.md > SHA256SUMS.txt)
      - name: Publish a clearly marked prototype prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.1 >/dev/null 2>&1; then
            echo 'Tag already published: refusing to overwrite existing release assets.'
            exit 1
          fi
          gh release create v0.8.1 /tmp/halo-release/* --target "$TARGET_SHA" --prerelease --title 'Halo of Flesh v0.8.1 — Corps et lieux cohérents' --notes-file docs/RELEASE_NOTES_v0.8.1.md
      - name: Remove only this one-time workflow
        run: |
          git checkout main
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-v081.yml
          git commit -m 'ci: remove one-time v0.8.1 packaging workflow'
          git push origin main
