name: Import verified fast-tap correction
on:
  push:
    branches: [feat/bitmap-sprites-v091]
    paths: ['.art-import/fast-tap-v095.xz']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/bitmap-sprites-v091'
          test "$(git rev-parse HEAD^)" = '8e53b6c2b19591d7b8d99428e95e24b2dc9bbf7c'
          python3 - <<'PY'
          import hashlib,lzma,pathlib,subprocess
          packed=pathlib.Path('.art-import/fast-tap-v095.xz').read_bytes()
          assert hashlib.sha256(packed).hexdigest()=='3de6d7e9056f800ef293bb5eaa640a11b7c8b0a89a82c2f0994cb385f27a0e2b'
          patch=lzma.decompress(packed)
          assert len(patch)==8035
          allowed={'CHANGELOG.md','docs/CORRECTIONS_v0.9.5.md','src/fight.js','tests/input-boundaries.test.mjs'}
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  for name in line.split()[2:]:
                      assert name[:2] in ('a/','b/') and name[2:] in allowed
          target=pathlib.Path('/tmp/halo-fast-tap.patch');target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          PY
      - name: Run engine regression tests
        run: npm test
      - name: Verify tree and publish source only
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          index_copy=$(mktemp)
          cp .git/index "$index_copy"
          GIT_INDEX_FILE="$index_copy" git update-index --force-remove .art-import/fast-tap-v095.xz .github/workflows/import-fast-tap-v095.yml
          actual_tree=$(GIT_INDEX_FILE="$index_copy" git write-tree)
          rm "$index_copy"
          test "$actual_tree" = 'ce2fe0bfb548964d55dfceb59961d0bc368c118d'
          git diff --cached --exit-code -- .github
          git config user.name darknigthmare
          git config user.email 7942594+darknigthmare@users.noreply.github.com
          git commit -m 'fix: retain short tactile attack impulses between simulation ticks'
          git push origin HEAD:refs/heads/feat/bitmap-sprites-v091
